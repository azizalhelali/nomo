<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="400" height="200" fill="white"/>

  <!-- Left side: Arabic text "نمو" -->
  <text x="100" y="140" font-size="120" font-weight="900" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" letter-spacing="-5">
    نمو
  </text>

  <!-- Right side: Circular design with NOMO -->
  <g transform="translate(280, 100)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#C9B8A3" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#D4AF6A" stroke-width="1" opacity="0.4"/>

    <!-- Decorative branches - Top -->
    <g opacity="0.7">
      <!-- Top left branch -->
      <path d="M -30 -60 Q -40 -70 -50 -65" fill="none" stroke="#A89968" stroke-width="1.5"/>
      <ellipse cx="-55" cy="-62" rx="5" ry="8" fill="#C9B8A3" transform="rotate(-25 -55 -62)"/>
      <ellipse cx="-45" cy="-68" rx="5" ry="8" fill="#D4AF6A" transform="rotate(20 -45 -68)"/>
      <ellipse cx="-35" cy="-65" rx="5" ry="8" fill="#C9B8A3" transform="rotate(45 -35 -65)"/>

      <!-- Top right branch -->
      <path d="M 30 -60 Q 40 -70 50 -65" fill="none" stroke="#A89968" stroke-width="1.5"/>
      <ellipse cx="55" cy="-62" rx="5" ry="8" fill="#C9B8A3" transform="rotate(25 55 -62)"/>
      <ellipse cx="45" cy="-68" rx="5" ry="8" fill="#D4AF6A" transform="rotate(-20 45 -68)"/>
      <ellipse cx="35" cy="-65" rx="5" ry="8" fill="#C9B8A3" transform="rotate(-45 35 -65)"/>
    </g>

    <!-- Decorative branches - Bottom -->
    <g opacity="0.7">
      <!-- Bottom left branch -->
      <path d="M -30 60 Q -40 70 -50 65" fill="none" stroke="#A89968" stroke-width="1.5"/>
      <ellipse cx="-55" cy="62" rx="5" ry="8" fill="#C9B8A3" transform="rotate(-25 -55 62)"/>
      <ellipse cx="-45" cy="68" rx="5" ry="8" fill="#D4AF6A" transform="rotate(20 -45 68)"/>

      <!-- Bottom right branch -->
      <path d="M 30 60 Q 40 70 50 65" fill="none" stroke="#A89968" stroke-width="1.5"/>
      <ellipse cx="55" cy="62" rx="5" ry="8" fill="#C9B8A3" transform="rotate(25 55 62)"/>
      <ellipse cx="45" cy="68" rx="5" ry="8" fill="#D4AF6A" transform="rotate(-20 45 68)"/>
    </g>

    <!-- Circuit elements - Top right -->
    <g opacity="0.6" stroke="#A89968" stroke-width="1" fill="none">
      <path d="M 35 -35 L 50 -35 L 50 -25"/>
      <rect x="48" y="-30" width="8" height="8" fill="none" stroke="#A89968" stroke-width="0.8"/>
      <circle cx="40" cy="-32" r="1.5" fill="#A89968"/>
      <text x="52" y="-20" font-size="6" fill="#A89968">IC</text>
    </g>

    <!-- Circuit elements - Right -->
    <g opacity="0.6" stroke="#A89968" stroke-width="1" fill="none">
      <path d="M 50 0 L 65 0"/>
      <rect x="63" y="-5" width="8" height="10" fill="none" stroke="#A89968" stroke-width="0.8"/>
      <circle cx="55" cy="-2" r="1.5" fill="#A89968"/>
      <text x="68" y="6" font-size="6" fill="#A89968">IC</text>
    </g>

    <!-- Circuit elements - Bottom right -->
    <g opacity="0.6" stroke="#A89968" stroke-width="1" fill="none">
      <path d="M 35 35 L 50 35 L 50 25"/>
      <rect x="48" y="22" width="8" height="8" fill="none" stroke="#A89968" stroke-width="0.8"/>
      <circle cx="40" cy="32" r="1.5" fill="#A89968"/>
      <text x="52" y="42" font-size="6" fill="#A89968">IC</text>
    </g>

    <!-- Center text: NOMO -->
    <text x="0" y="15" font-size="32" font-weight="bold" text-anchor="middle" fill="#A89968" font-family="Arial, sans-serif" letter-spacing="2">
      NOMO
    </text>
  </g>
</svg>
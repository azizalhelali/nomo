<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#1a1a1a" stroke-width="14"/>

  <!-- Inner circle background -->
  <circle cx="100" cy="100" r="80" fill="#0f0f0f"/>

  <!-- Diamond shape (نمو symbol) -->
  <g transform="translate(100, 100)">
    <!-- Main diamond -->
    <path d="M 0 -40 L 35 0 L 0 40 L -35 0 Z" fill="url(#grad1)" stroke="#FFD700" stroke-width="2"/>

    <!-- Inner diamond for depth -->
    <path d="M 0 -25 L 22 0 L 0 25 L -22 0 Z" fill="#FFE55C" opacity="0.6"/>

    <!-- Growth elements (small circles) -->
    <circle cx="0" cy="-50" r="4" fill="#FFD700"/>
    <circle cx="45" cy="-15" r="4" fill="#FFD700"/>
    <circle cx="45" cy="15" r="4" fill="#FFD700"/>
  </g>
</svg>